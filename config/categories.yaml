# config/categories.yaml — arXiv categories to ingest weekly
#
# Behavior:
#   - Commenting out a group stops NEW ingestion for those categories,
#     but preserves all historical data already in the database.
#   - Adding a group (uncommenting an existing block or adding a new one)
#     affects FUTURE runs only — backfill is a separate explicit step
#     triggered via `python -m src.pipeline backfill`.
#   - Category codes must match arXiv's official taxonomy:
#     https://arxiv.org/category_taxonomy

groups:
  ai_ml:
    - cs.AI
    - cs.LG
    - cs.CL
    - cs.NE
    - stat.ML

  robotics_systems:
    - cs.RO
    - eess.SY
    - cs.MA

